qube_servo2_hmi:
  ros__parameters:
    use_sim_time: true

    joint_name: "motor_hub_link_joint"

    command_topic: "/motor_voltage_controller/commands"
    joint_states_topic: "/joint_states"
    dynamic_joint_states_topic: "/dynamic_joint_states"

    voltage_limit: 10.0
    ui_refresh_hz: 50
    connection_timeout_ms: 1000
